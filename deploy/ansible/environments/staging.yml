---
deploy_account: portfolio-nonprod
# Share of the platform staging budget agreed in vps-services: 0.85 vCPU / 1024 MiB, init job included.
instance_budget: { cpus: 0.85, memory_mib: 1024 }
instance_limits:
  database: { cpus: 0.1, memory_mib: 160, pids: 128, shared_buffers: 32MB }
  directus: { cpus: 0.5, memory_mib: 448, pids: 256 }
  provision: { cpus: 0.1, memory_mib: 192, pids: 128 }
  api: { cpus: 0.1, memory_mib: 160, pids: 128 }
  site: { cpus: 0.05, memory_mib: 64, pids: 64 }
instance_storage_budget_gib: 3
instance_serves_site: true
portfolio_site_build_environment: staging
portfolio_cors_allowed_origins: 'https://portfolio-staging.apps.nyhasinavalona.com'
portfolio_monthly_model_budget_eur: '5'
portfolio_model_daily_call_limit: '2000'
# OpenRouter serves this model through Mistral only; its highest USD list prices are entered as euros.
portfolio_model_api_base_url: 'https://openrouter.ai/api/v1'
portfolio_model_name: 'mistralai/mistral-small-2603'
portfolio_model_input_price_eur_per_million: '0.165'
portfolio_model_output_price_eur_per_million: '0.66'
instance_mcp_oauth:
  enabled: true
  cimd_enabled: true
  dcr_enabled: true
  cimd_allowed_domains: 'chatgpt.com,claude.ai'
  allowed_redirect_domains: 'chatgpt.com,claude.ai'
