name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging-content:
        description: Content of the staging site, api (its active publication) or seed (first delivery only).
        type: choice
        options: [api, seed]
        default: api

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Build the Directus extension
        run: pnpm build:extension
      - name: Seed publication content
        run: pnpm content:seed
      - name: Build the site
        run: pnpm build:site

  e2e:
    name: Playwright e2e
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @portfolio/site exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: site/playwright-report

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Seed publication content
        run: pnpm content:seed
      - name: Build the site
        run: pnpm build:site
      - name: Lighthouse
        run: pnpm lighthouse
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: site/.lighthouseci

  integration:
    name: CMS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Disposable environment
        run: scripts/ci/write-env.sh
      - name: Start Postgres and Directus
        run: pnpm cms:up
      - name: Provision
        run: pnpm provision
      - name: Provision again
        run: pnpm provision
      - name: Integration tests
        run: pnpm test:cms
      - name: Directus logs
        if: failure()
        run: docker compose logs --no-color directus

  delivery:
    name: Delivery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the API dependencies
        run: pnpm install --frozen-lockfile --filter @portfolio/api...
      - name: Ansible
        run: |
          pip install --require-hashes -r deploy/requirements.txt
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Delivery input tests
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: ShellCheck
        run: shellcheck deploy/*.sh
      - name: Render and validate staging
        run: deploy/render.sh staging "$RUNNER_TEMP/render-staging"
      - name: Render and validate production
        run: deploy/render.sh prod "$RUNNER_TEMP/render-prod"

  # Pull requests: the images build without being published. main: published once, delivered to
  # staging, then promoted unchanged by production.yml.
  images:
    needs: [checks, delivery]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  staging-site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, lighthouse, integration, delivery]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/site.yml
    with:
      environment: staging
      content: ${{ inputs.staging-content || 'api' }}

  staging:
    needs: [images, staging-site]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      github-environment: nonprod
      release: ${{ needs.images.outputs.release }}
      site-image: ${{ needs.staging-site.outputs.site-image }}
    secrets: inherit

  release:
    name: Record the staging release
    needs: [images, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: release.json
        env:
          RELEASE: ${{ needs.images.outputs.release }}
        run: echo "$RELEASE" | jq . > release.json
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.json
          retention-days: 90
