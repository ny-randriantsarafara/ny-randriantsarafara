name: Deliver the selected production release

# Called under the production lock; content.yml shares the same lock through Pages completion.
on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      release-commit:
        type: string
        required: true
      promotion-run-id:
        type: string
        required: true
      require-current-main:
        type: boolean
        required: true
      site:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      github-environment: production
      release: ${{ inputs.release }}
      release-commit: ${{ inputs.release-commit }}
      promotion-run-id: ${{ inputs.promotion-run-id }}
      require-current-main: ${{ inputs.require-current-main }}
    secrets: inherit

  record:
    if: github.ref == 'refs/heads/main'
    name: Record the production release
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.release-commit }}
    steps:
      - name: Move the production-release tag
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release has no commit." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/production-release" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production-release" -f sha="$COMMIT" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/production-release -f sha="$COMMIT" > /dev/null
          fi
          echo "production-release -> $COMMIT" >> "$GITHUB_STEP_SUMMARY"

  site:
    if: inputs.site
    needs: [record]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/site.yml
    with:
      environment: prod
      ref: ${{ inputs.release-commit }}

  pages:
    needs: [site]
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
