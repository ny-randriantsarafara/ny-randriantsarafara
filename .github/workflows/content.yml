name: Content published

# Rebuilds the production site after a publication: dispatched by the API's publication hook
# (SITE_BUILD_TOKEN), or by hand to retry. Publishing is the owner's approval: no review gate here.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose publication changed.
        type: choice
        options: [production]
        required: true

permissions:
  contents: read

concurrency:
  group: production
  queue: max
  cancel-in-progress: false

jobs:
  # A content change never ships unreleased code: the site builds from the production release commit.
  production-release:
    name: Find the production release
    if: inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Commit of the production-release tag
        id: commit
        run: |
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/production-release" --jq .sha 2>/dev/null || true)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No production release yet: run Deploy production first." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  production-site:
    needs: production-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/site.yml
    with:
      environment: prod
      ref: ${{ needs.production-release.outputs.commit }}

  production-pages:
    needs: production-site
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
