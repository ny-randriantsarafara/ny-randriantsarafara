name: Deploy

# Sends one request to the VPS controller through deploy/ansible (ny.vps.app), then checks the public URLs.
on:
  workflow_call:
    inputs:
      environment:
        description: preview or prod.
        type: string
        required: true
      github-environment:
        description: GitHub environment holding the secrets, nonprod or production.
        type: string
        required: true
      operation:
        description: apply or destroy.
        type: string
        default: apply
      pull-request:
        description: Pull request number, previews only.
        type: number
        default: 0
      site-image:
        description: Preview static site image by digest.
        type: string
        default: ''
      release:
        description: JSON from images.yml; required for apply.
        type: string
        default: ''
      release-commit:
        description: Selected immutable code commit; required for production.
        type: string
        default: ''
      promotion-run-id:
        description: Trusted main push CI run; required for production.
        type: string
        default: ''
      require-current-main:
        description: Refuse stale main releases during automatic production delivery.
        type: boolean
        default: false
    outputs:
      site-url:
        value: ${{ jobs.deliver.outputs.site-url }}
      api-url:
        value: ${{ jobs.deliver.outputs.api-url }}
      cms-url:
        value: ${{ jobs.deliver.outputs.cms-url }}

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    if: >-
      (inputs.environment == 'prod' && inputs.github-environment == 'production' && inputs.operation == 'apply'
       && github.ref == 'refs/heads/main' && inputs.release-commit != '' && inputs.promotion-run-id != '')
      || (inputs.environment == 'preview' && inputs.github-environment == 'nonprod'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (inputs.operation == 'apply' || inputs.operation == 'destroy'))
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.github-environment }}
      url: ${{ inputs.operation == 'apply' && steps.hosts.outputs.site-url || '' }}
    outputs:
      site-url: ${{ steps.hosts.outputs.site-url }}
      api-url: ${{ steps.hosts.outputs.api-url }}
      cms-url: ${{ steps.hosts.outputs.cms-url }}
    env:
      DELIVERY_TOOLS: ${{ inputs.environment == 'prod' && '.delivery-policy/deploy' || 'deploy' }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      PULL_REQUEST: ${{ inputs.pull-request }}
      RELEASE_INPUT: ${{ inputs.release }}
      SITE_IMAGE: ${{ inputs.site-image }}
      PROMOTION_RUN: ${{ inputs.promotion-run-id }}
      REQUIRE_CURRENT_MAIN: ${{ inputs.require-current-main }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit || github.sha }}
          persist-credentials: false
      - name: Checkout current trusted production policy
        if: inputs.environment == 'prod'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .delivery-policy
          persist-credentials: false
      - name: Instance hostnames
        id: hosts
        run: |
          python3 "$DELIVERY_TOOLS/target.py" "$TARGET_ENVIRONMENT" --pull-request "$PULL_REQUEST" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == apply ]]; then
            RELEASE="$(jq -c --arg site "$SITE_IMAGE" 'if $site == "" then . else . + {site: $site} end' <<< "$RELEASE_INPUT")"
            echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          fi
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: Ansible
        run: |
          pip install --require-hashes -r deploy/requirements.txt
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Public images
        if: inputs.operation == 'apply'
        run: |
          mapfile -t images < <(jq -r '.directus, .api, .provision, (.site // empty)' <<< "$RELEASE")
          deploy/check-public-images.sh "${images[@]}"
      - name: Revalidate production immediately before private inputs
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_COMMIT: ${{ inputs.release-commit }}
        run: |
          if [[ ! "$PROMOTION_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "Select a numeric CI run ID." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN" > "$RUNNER_TEMP/run.json"
          printf '%s\n' "$RELEASE_INPUT" > "$RUNNER_TEMP/release.json"
          args=()
          if [[ "$REQUIRE_CURRENT_MAIN" == true ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            args+=(--current-main "$main_sha")
          fi
          python3 .delivery-policy/deploy/validate_promotion.py "$RUNNER_TEMP/run.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$PROMOTION_RUN" \
            --release "$RUNNER_TEMP/release.json" "${args[@]}" > "$RUNNER_TEMP/validated-release"
          test "$(git rev-parse HEAD)" = "$SELECTED_COMMIT"
          test "$(jq -r '.commit' "$RUNNER_TEMP/release.json")" = "$SELECTED_COMMIT"
      - name: Private production inputs
        if: inputs.environment == 'prod' && inputs.operation == 'apply'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DIRECTUS_SECRET: ${{ secrets.DIRECTUS_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          AI_PASSWORD: ${{ secrets.AI_PASSWORD }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PUBLICATION_HOOK_SECRET: ${{ secrets.PUBLICATION_HOOK_SECRET }}
          SITE_BUILD_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          AI_EMAIL: ${{ vars.AI_EMAIL }}
          API_EMAIL: ${{ vars.API_EMAIL }}
        run: bash "$DELIVERY_TOOLS/prepare-private.sh"
      - name: Private preview inputs
        if: inputs.environment == 'preview' && inputs.operation == 'apply'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # The nonprod Directus secret seeds stable, distinct credentials for each preview.
          PREVIEW_SECRET_SEED: ${{ secrets.DIRECTUS_SECRET }}
        run: bash "$DELIVERY_TOOLS/prepare-private.sh"
      - name: Private cleanup inputs
        if: inputs.environment == 'preview' && inputs.operation == 'destroy'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash "$DELIVERY_TOOLS/prepare-private.sh"
      - name: Deliver through vpsctl
        run: |
          ansible-playbook -i deploy/ansible/inventory.yml deploy/ansible/deploy.yml \
            --private-key "$PRIVATE_DIR/ssh-key" \
            -e "@$PRIVATE_DIR/secrets.json" -e "@$PRIVATE_DIR/delivery.json"
      - name: Public checks
        if: inputs.operation == 'apply'
        env:
          SITE_URL: ${{ steps.hosts.outputs.site-url }}
          API_URL: ${{ steps.hosts.outputs.api-url }}
          CMS_URL: ${{ steps.hosts.outputs.cms-url }}
        run: |
          args=()
          if [[ "$TARGET_ENVIRONMENT" == preview ]]; then
            args+=(--site "$SITE_URL")
          fi
          deploy/smoke.sh --api "$API_URL" --cms "$CMS_URL" "${args[@]}" --wait 300
      - name: Summary
        if: inputs.operation == 'apply'
        env:
          SITE_URL: ${{ steps.hosts.outputs.site-url }}
          API_URL: ${{ steps.hosts.outputs.api-url }}
          CMS_URL: ${{ steps.hosts.outputs.cms-url }}
        run: |
          {
            echo "### $TARGET_ENVIRONMENT"
            echo
            echo "- Site: $SITE_URL"
            echo "- API: $API_URL/health"
            echo "- CMS: $CMS_URL/admin"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/delivery"
