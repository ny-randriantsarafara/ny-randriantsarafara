name: Site

# Builds the static export of one environment from its active publication. Staging: packages it as
# the site image served by portfolio-staging. Production: uploads it as the GitHub Pages artifact
# that pages.yml deploys.
on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod.
        type: string
        required: true
      content:
        description: api (the environment's active publication) or seed (the initial content, first delivery only).
        type: string
        default: api
      ref:
        description: Commit to build; empty builds the commit of the run.
        type: string
        default: ''
    outputs:
      site-image:
        description: Staging only, the site image by digest.
        value: ${{ jobs.export.outputs.site-image }}

permissions:
  contents: read

jobs:
  export:
    name: Build the ${{ inputs.environment }} site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      site-image: ${{ steps.image.outputs.site-image }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      CONTENT: ${{ inputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Instance addresses
        id: hosts
        run: |
          case "$TARGET_ENVIRONMENT" in
            staging | prod) ;;
            *) echo "Unknown environment: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          {
            echo "site-url=https://$(jq -r --arg env "$TARGET_ENVIRONMENT" '.[$env].site' deploy/instances.json)"
            echo "api-url=https://$(jq -r --arg env "$TARGET_ENVIRONMENT" '.[$env].api' deploy/instances.json)"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Publication
        env:
          CONTENT_API_URL: ${{ steps.hosts.outputs.api-url }}
        run: |
          case "$CONTENT" in
            api) pnpm content:pull ;;
            seed) pnpm content:seed ;;
            *) echo "Unknown content source: $CONTENT" >&2; exit 1 ;;
          esac
          jq -r '"Publication \(.publicationId), activated \(.activatedAt)"' site/content/publication.json >> "$GITHUB_STEP_SUMMARY"
      - name: Static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.hosts.outputs.site-url }}
          NEXT_PUBLIC_API_URL: ${{ steps.hosts.outputs.api-url }}
        run: pnpm build:site
      - name: Buildx
        if: inputs.environment == 'staging'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        if: inputs.environment == 'staging'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Site image
        id: build
        if: inputs.environment == 'staging'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: site
          build-contexts: site-export=site/out
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/portfolio:site-${{ steps.hosts.outputs.commit }}-${{ github.run_id }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Site image reference
        id: image
        if: inputs.environment == 'staging'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio:site-${{ steps.hosts.outputs.commit }}-${{ github.run_id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "site-image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Pages artifact
        if: inputs.environment == 'prod'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out
